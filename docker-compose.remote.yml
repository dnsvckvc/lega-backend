version: '3.8'

services:
  db:
    image: postgres:15
    container_name: legal_backend_db_remote
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_backend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: legal_backend_web_remote
    user: root
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - POSTGRES_DB=${POSTGRES_DB:-legal_backend}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - logs_data:/app/logs
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py create_demo_users --clear &&
             python manage.py runserver 0.0.0.0:8000"

  nginx:
    image: nginx:alpine
    container_name: legal_backend_nginx_remote
    ports:
      - "80:80"
    volumes:
      - ./nginx.remote.conf:/etc/nginx/nginx.conf
      - ./media:/app/media
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  logs_data:

networks:
  default:
    name: legal_backend_network_remote